[project]
name = "speakeasy"
version = "0.1.0"
description = "OpenAI-compatible audio transcription server: Whisper + Moonshine on ROCm and CUDA"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "faster-whisper>=1.2.1",
    "av<19",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "pydantic-settings>=2.15.0",
    "soundfile>=0.13",
    "scipy>=1.14",
    "transformers>=4.46",
    "torch>=2.5",
    "accelerate>=1.0",
]

[project.optional-dependencies]
# CUDA deployments get the default PyPI ctranslate2 (pulled by faster-whisper).
# ROCm deployments must install the official CTranslate2 ROCm wheel instead —
# see Dockerfile.rocm.
rocm = []

[project.scripts]
speakeasy = "speakeasy.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# The Docker images (Dockerfile.cuda / Dockerfile.rocm) are built FROM the
# official pytorch/pytorch and rocm/pytorch containers, which already ship a
# matching GPU torch + CUDA/ROCm runtime stack. `uv sync` there skips the
# lockfile's torch/triton/nvidia-*/cuda-* packages (--no-install-package)
# so the base image's stack is used unmodified; on ROCm the PyPI
# ctranslate2 is additionally replaced by the official CTranslate2 ROCm
# wheel. Nothing needs to be installed from these groups by hand — they
# exist to document where the GPU wheels come from.
rocm = []
cuda = []
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
